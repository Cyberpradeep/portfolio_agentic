<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pradeep Agentic Portfolio - Base Pipeline</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/style.css?v=2" />
</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <div class="brand-icon" aria-hidden="true">PS</div>
                <div class="brand-text">
                    <div class="brand-name">Pradeep Selladurai</div>
                    <div class="brand-sub">AI Engineer • Voice AI • Agentic AI</div>
                </div>
            </div>
            <div class="top-actions">
                <a class="icon-btn" href="https://www.linkedin.com/in/pradeepselladurai/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile" title="LinkedIn">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M4.98 3.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5ZM3 9h4v12H3V9Zm7.5 0H14v1.8h.05c.48-.9 1.65-1.85 3.4-1.85 3.63 0 4.3 2.4 4.3 5.5V21h-4v-5.1c0-1.22-.02-2.8-1.7-2.8-1.7 0-1.96 1.33-1.96 2.7V21h-4V9Z" />
                    </svg>
                    <span class="sr-only">LinkedIn</span>
                </a>
                <a class="icon-btn" href="https://github.com/Cyberpradeep" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile" title="GitHub">
                    <svg viewBox="0 0 24 24" aria-hidden="true" class="is-fill">
                        <path
                            d="M12 2.2a9.8 9.8 0 0 0-3.1 19.1c.5.1.7-.2.7-.5v-1.7c-2.9.6-3.5-1.2-3.5-1.2-.5-1.2-1.2-1.5-1.2-1.5-1-.7.1-.7.1-.7 1.1.1 1.7 1.1 1.7 1.1 1 1.7 2.7 1.2 3.3.9.1-.7.4-1.2.7-1.5-2.3-.2-4.7-1.1-4.7-5.1 0-1.1.4-2 1.1-2.7-.1-.2-.5-1.3.1-2.6 0 0 .9-.3 2.9 1.1.8-.2 1.7-.3 2.6-.3.9 0 1.8.1 2.6.3 2-1.4 2.9-1.1 2.9-1.1.6 1.3.2 2.4.1 2.6.7.7 1.1 1.6 1.1 2.7 0 4-2.4 4.8-4.7 5.1.4.3.8 1 .8 2.1v3.1c0 .3.2.6.7.5A9.8 9.8 0 0 0 12 2.2Z" />
                    </svg>
                    <span class="sr-only">GitHub</span>
                </a>
                <a class="icon-btn" href="#" aria-label="Download resume" title="Resume">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 2h7l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm6 1.5V8h4.5" />
                        <path d="M8 12h8M8 15h8M8 18h5" />
                    </svg>
                    <span class="sr-only">Resume</span>
                </a>
                <div id="status" class="status-pill">disconnected</div>
            </div>
        </header>

        <main class="stage">
            <div class="scene">
                <canvas id="viewer"></canvas>
            </div>

            <div id="speechStack" class="speech-stack">
                <div id="welcomeBubble" class="speech-bubble">
                    <p><strong>Hey, I'm Pradeep 👋</strong></p>
                
                    <p>
                        AI Engineer in Progress
                    </p>
                
                    <p>
                        Voice AI • Agentic AI • Generative AI
                    </p>
                
                    <p>
                        Ask me about projects, internships,
                        skills, certifications or my AI journey.
                    </p>
                </div>
                <div class="speech-connector" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <div id="messageLayer" class="message-layer"></div>

            <div id="avatarState" class="avatar-state">● Online</div>

            <div class="controls">
                <button id="talkBtn" class="talk-btn" type="button">Talk With Me</button>
                <div id="inputShell" class="input-shell">
                    <input id="textInput" type="text" placeholder="Ask about projects, skills, or experience..." />
                    <button id="sendBtn" class="send-btn" aria-label="Send message">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 12h13" />
                            <path d="M12 5l6 7-6 7" />
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/",
                "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js",
                "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3/lib/three-vrm-animation.module.min.js"
            }
        }
    </script>

    <script src="/static/js/media-handler.js"></script>
    <script src="/static/js/gemini-client.js"></script>
    <script type="module" src="/static/js/avatar.js"></script>
    <script src="/static/js/main.js"></script>
</body>

</html>
