                    <p>
                        AI Engineer in Progress

                    <p>
                        Voice AI • Agentic AI • Generative AI
                    </p>
                
                    <p>
                        Ask me about projects, internships,
                        skills, certifications or my AI journey.
                    </p>
                </div>
                <div class="speech-connector" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <div id="convLeft" class="conv-card user"></div>
            <div id="convRight" class="conv-card assistant"></div>

            <div id="avatarState" class="avatar-state">● Online</div>

            <div class="controls">
                <button id="talkBtn" class="talk-btn" type="button">Talk With Me</button>

    <script type="importmap">
        {
            "imports": {

    <script src="/static/js/media-handler.js"></script>

    <script type="module" src="/static/js/avatar.js"></script>
    <script src="/static/js/main.js?v=16"></script>

    <!-- ── Intro Animation ── -->
    <script>
        (function () {
            const overlay   = document.getElementById('introOverlay');
            const screen1   = document.getElementById('introScreen1');
            const screen2   = document.getElementById('introScreen2');
            const greetEl   = document.getElementById('introGreet');
            const nameEl    = document.getElementById('introName');
            const subEl     = document.getElementById('introSub');
            const cursor    = document.getElementById('introCursor');
            const app       = document.querySelector('.app');

            const GREET_TEXT = 'Vanakkam';
            const NAME_TEXT  = 'Pradeep Selladurai';
            const SUB_TEXT   = 'Ready to talk with me?';

            // Hide app and screen2 initially
            app.style.opacity    = '0';
            app.style.transform  = 'translateY(18px)';
            app.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
            screen2.style.opacity    = '0';
            screen2.style.transition = 'opacity 0.5s ease';

            function typeChar(el, text, idx, done) {
                if (idx >= text.length) { done && done(); return; }
                el.textContent += text[idx];
                setTimeout(() => typeChar(el, text, idx + 1, done), 72);
            }

            // ── Screen 1: type Vanakkam, hold, then fade out ──
            setTimeout(() => {
                typeChar(greetEl, GREET_TEXT, 0, () => {
                    // Hold for 800ms then fade Screen 1 out
                    setTimeout(() => {
                        screen1.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                        screen1.style.opacity    = '0';
                        screen1.style.transform  = 'translateY(-20px)';

                        // ── Screen 2: fade in and start typing name ──
                        setTimeout(() => {
                            screen1.style.display = 'none';
                            screen2.style.opacity = '1';

                            setTimeout(() => {
                                typeChar(nameEl, NAME_TEXT, 0, () => {
                                    setTimeout(() => {
                                        cursor.style.opacity = '0';
                                        subEl.style.opacity  = '1';
                                        typeChar(subEl, SUB_TEXT, 0, () => {
                                            // Hold then reveal portfolio
                                            setTimeout(() => {
                                                overlay.style.transform = 'translateY(-100%)';
                                                overlay.style.opacity   = '0';
                                                setTimeout(() => {
                                                    app.style.opacity   = '1';
                                                    app.style.transform = 'translateY(0)';
                                                    setTimeout(() => overlay.remove(), 900);
                                                }, 300);
                                            }, 900);
                                        });
                                    }, 400);
                                });
                            }, 200);
                        }, 550);
                    }, 800);
                });
            }, 200);
        })();
    </script>
